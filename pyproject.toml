[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "divid"
version = "0.1.0"
description = "Six-dimensional diagnostic evaluation of video generation diversity"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<2",
    "scipy>=1.10",
    "opencv-python>=4.8",
    "pillow>=10",
    "torch>=2.1",
    "torchvision>=0.16",
    "transformers>=4.40",
    "open-clip-torch>=2.24",
]

[project.scripts]
divid = "divid.cli:main"

[tool.setuptools.packages.find]
include = ["divid*"]
